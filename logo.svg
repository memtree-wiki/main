<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F6F5C"/>
      <stop offset="100%" stop-color="#2FA084"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C3A"/>
      <stop offset="100%" stop-color="#1F6F5C"/>
    </linearGradient>
  </defs>

  <!-- Branches: root splits into two, left child splits again (illustrating the split/consolidate mechanic) -->
  <g fill="none" stroke="url(#branchGrad)" stroke-width="4" stroke-linecap="round">
    <path d="M120,72 C120,95 78,95 78,120"/>
    <path d="M120,72 C120,95 162,95 162,120"/>
    <path d="M78,132 C78,150 54,150 54,168"/>
    <path d="M78,132 C78,150 102,150 102,168"/>
  </g>

  <!-- Root node -->
  <circle cx="120" cy="56" r="26" fill="url(#rootGrad)"/>
  <rect x="108" y="46" width="24" height="4" rx="2" fill="#EAF6F1"/>
  <rect x="108" y="54" width="24" height="4" rx="2" fill="#EAF6F1"/>
  <rect x="108" y="62" width="16" height="4" rx="2" fill="#EAF6F1"/>

  <!-- Right child node (unsplit topic) -->
  <circle cx="162" cy="132" r="20" fill="#2FA084"/>
  <rect x="152" y="124" width="20" height="3.5" rx="1.75" fill="#EAF6F1"/>
  <rect x="152" y="131" width="20" height="3.5" rx="1.75" fill="#EAF6F1"/>
  <rect x="152" y="138" width="13" height="3.5" rx="1.75" fill="#EAF6F1"/>

  <!-- Left child node (mid-split, slightly smaller / active) -->
  <circle cx="78" cy="120" r="18" fill="#3DB894"/>
  <rect x="69" y="113" width="18" height="3.2" rx="1.6" fill="#EAF6F1"/>
  <rect x="69" y="119.5" width="18" height="3.2" rx="1.6" fill="#EAF6F1"/>
  <rect x="69" y="126" width="12" height="3.2" rx="1.6" fill="#EAF6F1"/>

  <!-- Two leaf nodes (newly extracted subtopics) -->
  <circle cx="54" cy="180" r="13" fill="#57C7A3"/>
  <circle cx="102" cy="180" r="13" fill="#57C7A3"/>

  <!-- Subtle sparks marking agent-driven creation on the newest nodes -->
  <g fill="#F4B942">
    <path d="M54,163 l2,4 l4,2 l-4,2 l-2,4 l-2,-4 l-4,-2 l4,-2 z"/>
    <path d="M102,163 l2,4 l4,2 l-4,2 l-2,4 l-2,-4 l-4,-2 l4,-2 z"/>
  </g>
</svg>
