name: Publish Packages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write # Required for OIDC trusted publishing & provenance

jobs:
    publish-docs:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Use bunx npm publish to generate provenance automatically via OIDC.
            # Skip if this version is already on the registry, since this runs on
            # every push to main and not every push bumps versions.
            - name: Publish with Provenance
              working-directory: projects/docs
              run: |
                  name=$(bun -e "console.log(require('./package.json').name)")
                  version=$(bun -e "console.log(require('./package.json').version)")
                  if bunx npm view "$name@$version" version >/dev/null 2>&1; then
                      echo "$name@$version already published, skipping"
                  else
                      echo "Publishing $name@$version"
                      bunx npm publish --access public --provenance
                  fi

